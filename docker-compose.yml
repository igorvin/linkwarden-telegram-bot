name: linkwarden
services:

  linkwarden-telegram-bot:
    container_name: telegram-linkwarden-bot
    build:
      context: .
      dockerfile: Dockerfile
    image: linkwarden-telegram-bot:local
    networks:
      - internal
    environment:
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN}
      - LINKWARDEN_API_URL=${LINKWARDEN_API_URL}
      - LINKWARDEN_API_KEY=${LINKWARDEN_API_KEY}
      - ALLOWED_TELEGRAM_USER_ID=${ALLOWED_TELEGRAM_USER_ID}
      - ALLOWED_TELEGRAM_GROUP_ID=${ALLOWED_TELEGRAM_GROUP_ID:-0}
      - TELEGRAM_TOPIC_COLLECTIONS=${TELEGRAM_TOPIC_COLLECTIONS:-}
      - BOT_STATE_PATH=/app/data/submissions.sqlite3
    volumes:
      - bot-state:/app/data
    command: ["python", "bot.py"]
    restart: unless-stopped

networks:
  internal:

volumes:
  bot-state:
